[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchguardian"
version = "0.2.15"
description = "Observability, logging, database, authentication and server utilities for Python applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Brayan de Souza Dias Vaz" }
]
dependencies = [
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.0",
    "PyJWT==2.15.1",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "requests==2.34.2",
    "SQLAlchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
    "websockets==16.0",
]

[project.urls]
Repository = "https://github.com/BrayanDevZN/WatchGuardian"

[project.scripts]
watchguardian = "WatchGuardian._internal.cli.main:main"
watchguardian-project = "WatchGuardian._internal.cli.project_commands:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["WatchGuardian", "WatchGuardian.*"]
