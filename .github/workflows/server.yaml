name: server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: get dependences
        run: pip install -r requirements.txt

      - name: init api replicas
        run: |
          python -m tests.functional.cli server run tests.functional.api:app --detached --port 8000
          python -m tests.functional.cli server run tests.functional.api:app --detached --port 8001
          python -m tests.functional.cli server run tests.functional.api:app --detached --port 8002
          sleep 10

      - name: init balance api
        run: python -m tests.functional.cli balance create tests.functional.api_balance:replicas --detached --port 8003

      - name: test balance health
        run: |
          sleep 5
          python -m tests.functional.client_balance

      - name: execute client
        run: python -m tests.functional.client

      - name: get logs
        run: |
          TOKEN=$(python - <<'PY'
          import asyncio
          import contextlib
          import sys

          from src.service.module import Settings, WatchAuth

          settings = Settings()
          settings.secrets["secret"] = "watchguardian-functional-test-secret-2026"
          auth = WatchAuth(settings=settings)

          with contextlib.redirect_stdout(sys.stderr):
              token = asyncio.run(auth.user_token(payload={"sub": "functional-cli-test"}))

          print(token)
          PY
          )
          python -m tests.functional.cli server logs --token "$TOKEN"

      - name: execute replicate
        run: python -m tests.functional.replicate
