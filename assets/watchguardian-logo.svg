<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">WatchGuardian logo</title>
  <desc id="desc">A cyber owl inside a shield, representing observability, protection and control.</desc>
  <defs>
